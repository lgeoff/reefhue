[package]
name = "reefhue-engine"
version = "0.1.0"
edition = "2021"
description = "Underwater colour-restoration engine (no_std, no dependencies) compiled to WebAssembly"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
doctest = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(minicore)'] }
