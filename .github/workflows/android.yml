name: Android picker test
on:
  push:
    branches: [android-ci]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Chromium snapshot folders
        run: |
          curl -s "https://commondatastorage.googleapis.com/chromium-browser-snapshots/?prefix=Android&delimiter=/" | grep -o '<Prefix>[^<]*</Prefix>' | head -20
          for d in Android Android_Arm64 Android_x64 Android_x86; do echo "$d: $(curl -s https://commondatastorage.googleapis.com/chromium-browser-snapshots/$d/LAST_CHANGE)"; done
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tests/android/explore.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}
          path: out/
