name: Android picker test
on:
  push:
    branches: [android-ci]
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tests/android/run.sh ${{ matrix.api }}
      - name: Publish results to a branch
        if: always()
        run: |
          mkdir -p out && cp -r out /tmp/results && cd /tmp/results
          git init -q && git checkout -q -b r
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "android ${{ matrix.api }} results ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r:refs/heads/android-results-${{ matrix.api }}
